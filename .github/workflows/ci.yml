name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build JM.Asp.Versioning.sln -c Release

      - name: Test
        run: dotnet test JM.Asp.Versioning.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/JM.Asp.Versioning -c Release --no-build -o nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg
